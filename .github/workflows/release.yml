name: Lumora unsigned prerelease

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  preflight:
    name: Verify release tag and source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22.x'
          cache: false
      - run: npm ci
      - run: node scripts/release/verify-release-tag.cjs
      - run: npm run verify

  package:
    name: Package release (${{ matrix.label }})
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            platform: win
            arch: x64
            artifact_arch: x64
            extension: exe
            builder_args: --win nsis --x64
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            artifact_arch: x86_64
            extension: AppImage
            builder_args: --linux AppImage --x64
          - label: macOS Apple Silicon
            runner: macos-15
            platform: mac
            arch: arm64
            artifact_arch: arm64
            extension: dmg
            builder_args: --mac dmg --arm64
          - label: macOS Intel
            runner: macos-15-intel
            platform: mac
            arch: x64
            artifact_arch: x64
            extension: dmg
            builder_args: --mac dmg --x64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22.x'
          cache: false
      - run: npm ci
      - run: npm run build
      - run: npm run helper:build
      - run: npx electron-builder ${{ matrix.builder_args }} --publish never
      - run: node scripts/release/verify-package.cjs --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: lumora-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/Lumora-*-${{ matrix.platform }}-${{ matrix.artifact_arch }}.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create draft prerelease
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum Lumora-* > SHA256SUMS.txt
      - name: Create Lumora draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-assets/*
          --verify-tag
          --draft
          --prerelease
          --generate-notes
          --title "Lumora $GITHUB_REF_NAME"
