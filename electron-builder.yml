appId: app.lumora.desktop
productName: Lumora
artifactName: Lumora-${version}-${os}-${arch}.${ext}

directories:
  output: dist
  buildResources: resources/icons/lumora

files:
  - out/**/*

asar: true
asarUnpack:
  - node_modules/node-pty/**/*
npmRebuild: false
forceCodeSigning: false

extraResources:
  - from: resources/icons/lumora/windows/LumoraTransparent.ico
    to: icons/LumoraTransparent.ico

extraMetadata:
  desktopName: app.lumora.desktop

win:
  executableName: Lumora
  icon: windows/LumoraTransparent.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: windows/LumoraTransparent.ico
  uninstallerIcon: windows/LumoraTransparent.ico
  installerHeaderIcon: windows/LumoraTransparent.ico

mac:
  executableName: Lumora
  icon: macos/Lumora.icns
  category: public.app-category.developer-tools
  identity: null
  hardenedRuntime: false
  target:
    - target: dmg
      arch:
        - x64
        - arm64

linux:
  executableName: lumora
  syncDesktopName: true
  icon: linux/lumora.png
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
